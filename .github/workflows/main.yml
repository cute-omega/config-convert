name: Deploy to GitHub Pages
permissions:
  contents: write

on:
  schedule:
    # - cron: "0,30 * * * *" # 在每小时的00分和30分运行
    - cron: "0 0/8 * * *" # 每8小时运行
  workflow_dispatch: # 允许手动触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global pull.rebase false

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run config converting script
        run: python src/main.py --dns

      - name: Commit refreshed fallback config
        # assets/final_config.json 是"所有来源都拉不到"时的最后兜底，必须随每次成功运行刷新，
        # 否则会像 2026-04 那样陈旧数月（连 remoteConfig.url 都可能指向已失效的地址）。
        run: |
          git add assets/final_config.json
          git diff --staged --quiet || git commit -m "chore: 刷新回退配置（最后一次成功产物）"
          # main 受规则集保护（要求 PR + CodeQL 结果），直推必被拒；这里降级为 warning，
          # 不能让回退配置的刷新挡住后面真正要发布的 Pages 产物
          git push origin HEAD:main || echo "::warning::main 受规则集保护，回退配置未能推送（不影响 Pages 发布）"

      - name: Checkout Pages repository
        uses: actions/checkout@v5
        with:
          repository: cute-omega/cute-omega.github.io
          token: ${{ secrets.PAT }}
          path: pages-repo

      - name: Copy and commit to Pages repo
        run: |
          mkdir -p pages-repo/other-assets
          cp assets/final_config.json pages-repo/other-assets/ds-config.json
          cp assets/final_config_dns.json pages-repo/other-assets/ds-config-dns.json
          cd pages-repo
          git checkout master || git checkout -b master
          git add other-assets/ds-config.json other-assets/ds-config-dns.json || true
          git commit -m "Update ds-config.json / ds-config-dns.json to new location for permanent migration solution" || echo "No changes to commit"
          git pull origin master --no-edit
          git push origin master
